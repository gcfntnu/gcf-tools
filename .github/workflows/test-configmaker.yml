name: Test configmaker

on: [push, pull_request]

jobs:
  libprep:
    name: Shared validation, libprep API and standalone CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire the exact development baseline once
        run: python3.11 scripts/dev.py setup
      - name: Editable, wheel and sdist checks offline
        run: python3.11 scripts/dev.py check all
      - name: Retain source, dependency and check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python311-check-evidence
          include-hidden-files: true
          path: |
            ${{ github.workspace }}-local/setups/*/identity.json
            ${{ github.workspace }}-local/setups/*/packages.txt
            ${{ github.workspace }}-local/setups/*/acquisition.log
            ${{ github.workspace }}-local/runs/*/identity.json
            ${{ github.workspace }}-local/runs/*/*packages.txt
            ${{ github.workspace }}-local/runs/*/tests.xml
            ${{ github.workspace }}-local/runs/*/tests.log
            ${{ github.workspace }}-local/runs/*/build.log
            ${{ github.workspace }}-local/runs/*/dist/contents.json
            ${{ github.workspace }}-local/runs/*/wheel-tests/tests.xml
            ${{ github.workspace }}-local/runs/*/wheel-tests/tests.log
            ${{ github.workspace }}-local/runs/*/sdist-setup.log
            ${{ github.workspace }}-local/runs/*/sdist-tests.log
  build:
    name: build (3.8)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Acquire historical runtime comparator once
        shell: bash
        run: |
          mkdir -p .dev/legacy/tmp .dev/legacy/cache
          export TMPDIR="$PWD/.dev/legacy/tmp"
          export PIP_CACHE_DIR="$PWD/.dev/legacy/cache"
          python -m venv .dev/legacy/venv
          .dev/legacy/venv/bin/python -m pip download --only-binary=:all: -r requirements-python38.txt -d .dev/legacy/wheels
          .dev/legacy/venv/bin/python -m pip install --no-index --find-links .dev/legacy/wheels -r requirements-python38.txt
          .dev/legacy/venv/bin/python -m pip install --no-index --no-build-isolation --no-deps .
          cp tests/support/sitecustomize.py .dev/legacy/venv/lib/python3.8/site-packages/sitecustomize.py
      - name: Installed commands and historical initialization offline
        shell: bash
        run: |
          export GCF_DEV_OFFLINE=1 PYTHONDONTWRITEBYTECODE=1 PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1
          export TMPDIR="$PWD/.dev/legacy/tmp"
          export PIP_CACHE_DIR="$PWD/.dev/legacy/cache"
          unset PYTHONPATH
          git rev-parse HEAD > .dev/legacy/source.txt
          .dev/legacy/venv/bin/python -m pip freeze --all > .dev/legacy/packages.txt
          .dev/legacy/venv/bin/python -m pip check
          .dev/legacy/venv/bin/python scripts/legacy_check.py .dev/legacy/run
      - name: Retain legacy dependency identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python38-check-identity
          include-hidden-files: true
          path: |
            .dev/legacy/packages.txt
            .dev/legacy/source.txt
            .dev/legacy/run/*/command.log
