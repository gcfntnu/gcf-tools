[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcf-tools"
dynamic = ["version"]
description = "In-house tool to create configs used in bio informatics pipelines at GCF, NTNU, Trondheim."
readme = "README.md"
license = {text = "BSD"}
authors = [{name = "GCF, NTNU, Trondheim - Arnar Flatberg, Geir Amund Svan Hasle", email = "arnar.flatberg@ntnu.no"}]
# No new Requires-Python claim: development baseline != runtime support policy.
dependencies = [
    "pandas", "xlrd==1.2.0", "oyaml", "PyYAML", "thefuzz", "six", "requests",
    "python-Levenshtein", "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "build"]

[project.urls]
Homepage = "https://github.com/gcfntnu/gcf-tools"

[tool.setuptools]
packages = ["configmaker", "testdata", "peppy_support", "descriptors"]
# Preserve the existing filenames and __main__ shadowing protection.
script-files = ["configmaker/configmaker.py", "testdata/create_testdata.py"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "configmaker.__version__"}

[tool.setuptools.package-data]
descriptors = ["*.yaml", "*.pkl"]
